<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Experimento G — Fase 02</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Inter', 'Segoe UI', sans-serif;
}

body {
  background: #000;
  color: #f5f5f5;
}

/* ===== PARTÍCULAS ===== */
.particles {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: -1;
  overflow: hidden;
}

.particle {
  position: absolute;
  background: white;
  border-radius: 50%;
  filter: blur(2px);
  opacity: 0.15;
  animation: float linear infinite;
}

@keyframes float {
  from { transform: translateY(100vh); }
  to { transform: translateY(-10vh); }
}

/* ===== CONTAINER ===== */
.container {
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 40px 20px;
}

.content {
  max-width: 600px;
  width: 100%;
  text-align: center;
}

h1 {
  font-weight: 300;
  letter-spacing: 3px;
  font-size: clamp(18px, 4vw, 24px);
  margin-bottom: 30px;
  opacity: 0.8;
}

.texto {
  font-size: clamp(14px, 3.8vw, 17px);
  line-height: 1.7;
  margin-bottom: 30px;
  color: #cccccc;
}

input {
  width: 100%;
  max-width: 320px;
  padding: 12px;
  background: transparent;
  border: 1px solid #fff;
  color: #fff;
  text-align: center;
  font-size: 15px;
  letter-spacing: 2px;
  outline: none;
}

button {
  margin-top: 18px;
  padding: 10px 30px;
  background: transparent;
  border: 1px solid #fff;
  color: #fff;
  cursor: pointer;
  transition: 0.3s;
}

button:hover {
  background: #fff;
  color: #000;
}

.dicas {
  margin-top: 25px;
  font-size: 14px;
  color: #aaa;
  min-height: 60px;
}

.sucesso {
  margin-top: 25px;
  font-size: 16px;
  letter-spacing: 2px;
  opacity: 0;
  transition: 1s;
}

.mostrar {
  opacity: 1;
}

@media (max-width: 480px) {
  .container {
    padding: 30px 15px;
  }
  .texto p {
  margin-bottom: 18px;
}
}
</style>
</head>
<body>

<div class="particles" id="particles"></div>

<div class="container">
  <div class="content">
    <h1>FASE 02</h1>

<div class="texto">

<p>
em uma grandE cidade, houve um acideNTe radiológico, considerado o maior do mundo (fora de uMa usina nuclear), com isso pEssoas foram afetAdas e toneLadas de rejEitos contaminados. foi realmente maRcante no entanto.
</p>

</div>

    <input type="text" id="resposta" placeholder="Digite sua resposta">
    <br>
    <button onclick="verificar()">CONFIRMAR</button>

    <div class="dicas" id="dicas"></div>

    <div class="sucesso" id="sucesso">
      Fragmento coletado: REALMENTE
    </div>
  </div>
</div>

<script>

/* Verifica fase 01 */
if (!localStorage.getItem("fragmento1")) {
  window.location.href = "index.html";
}

/* Partículas */
const particlesContainer = document.getElementById("particles");

for (let i = 0; i < 30; i++) {
  const particle = document.createElement("div");
  particle.classList.add("particle");

  const size = Math.random() * 4 + 2;
  particle.style.width = size + "px";
  particle.style.height = size + "px";
  particle.style.left = Math.random() * 100 + "vw";
  particle.style.animationDuration = (15 + Math.random() * 15) + "s";
  particle.style.opacity = Math.random() * 0.2 + 0.05;

  particlesContainer.appendChild(particle);
}

/* Lógica */
let tentativas = 0;

const dicasLista = [
  "Dica 1: Observe letras fora do padrão.",
  "Dica 2: Algumas maiúsculas estão no meio das palavras.",
  "Dica 3: Junte essas letras e reorganize."
];

function normalizar(texto) {
  return texto
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "");
}

function verificar() {
  const input = document.getElementById("resposta").value.trim();
  const resposta = normalizar(input);

  if (resposta === "realmente") {

    localStorage.setItem("fragmento2", "REALMENTE");

    document.getElementById("sucesso").classList.add("mostrar");

    setTimeout(() => {
      window.location.href = "fase03.html";
    }, 2000);

  } else {

    if (tentativas < dicasLista.length) {
      const dica = document.createElement("div");
      dica.textContent = dicasLista[tentativas];
      document.getElementById("dicas").appendChild(dica);
      tentativas++;
    }
  }
}

</script>

</body>
</html>
