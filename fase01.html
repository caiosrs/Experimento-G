<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Experimento G — Fase 01</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Inter', 'Segoe UI', sans-serif;
}

body {
  background: #000;
  color: #f5f5f5;
  overflow: hidden;
}

/* ===== PARTÍCULAS ===== */
.particles {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: -1;
  overflow: hidden;
}

.particle {
  position: absolute;
  background: white;
  border-radius: 50%;
  filter: blur(2px);
  opacity: 0.15;
  animation: float linear infinite;
}

@keyframes float {
  from { transform: translateY(100vh); }
  to { transform: translateY(-10vh); }
}

/* ===== CONTAINER ===== */
.container {
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
  text-align: center;
}

.content {
  max-width: 600px;
  width: 100%;
}

h1 {
  font-weight: 300;
  letter-spacing: 3px;
  font-size: clamp(18px, 4vw, 24px);
  margin-bottom: 40px;
  opacity: 0.8;
}

.enigma {
  font-size: clamp(18px, 4vw, 26px);
  letter-spacing: 6px;
  margin-bottom: 30px;
}

input {
  width: 100%;
  max-width: 300px;
  padding: 12px;
  background: transparent;
  border: 1px solid #fff;
  color: #fff;
  text-align: center;
  font-size: 16px;
  letter-spacing: 2px;
  outline: none;
}

button {
  margin-top: 20px;
  padding: 10px 30px;
  background: transparent;
  border: 1px solid #fff;
  color: #fff;
  cursor: pointer;
  transition: 0.3s;
}

button:hover {
  background: #fff;
  color: #000;
}

.dicas {
  margin-top: 30px;
  font-size: 14px;
  color: #aaa;
  min-height: 60px;
}

.sucesso {
  margin-top: 30px;
  font-size: 18px;
  letter-spacing: 3px;
  opacity: 0;
  transition: 1s;
}

.mostrar {
  opacity: 1;
}

@media (max-width: 480px) {
  input {
    width: 100%;
  }
}
</style>
</head>
<body>

<div class="particles" id="particles"></div>

<div class="container">
  <div class="content">
    <h1>FASE 01</h1>

    <div class="enigma">
      _ _ _ _ _ _' _ _ ( _ _ _ )
    </div>

    <input type="text" id="resposta" placeholder="Digite sua resposta">

    <br>
    <button onclick="verificar()">CONFIRMAR</button>

    <div class="dicas" id="dicas"></div>

    <div class="sucesso" id="sucesso">
      Fragmento coletado: VOCÊ
    </div>

  </div>
</div>

<script>

/* ===== PARTÍCULAS ===== */
const particlesContainer = document.getElementById("particles");

for (let i = 0; i < 35; i++) {
  const particle = document.createElement("div");
  particle.classList.add("particle");

  const size = Math.random() * 4 + 2;
  particle.style.width = size + "px";
  particle.style.height = size + "px";
  particle.style.left = Math.random() * 100 + "vw";
  particle.style.animationDuration = (15 + Math.random() * 15) + "s";
  particle.style.opacity = Math.random() * 0.2 + 0.05;

  particlesContainer.appendChild(particle);
}

/* ===== LÓGICA DO ENIGMA ===== */

let tentativas = 0;

const dicasLista = [
  "Dica 1: Cantor que nasceu em um dia especial.",
  "Dica 2: Peter Gene Hernandez.",
  "Dica 3: Nothin' on (You) - PTBR."
];

function normalizar(texto) {
  return texto
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "");
}

function verificar() {
  const input = document.getElementById("resposta").value.trim();
  const resposta = normalizar(input);

  if (resposta === "voce") {

    // salva fragmento
    localStorage.setItem("fragmento1", "VOCÊ");

    const sucesso = document.getElementById("sucesso");
    sucesso.classList.add("mostrar");

    setTimeout(() => {
      window.location.href = "fase02.html";
    }, 2000);

  } else {

    if (tentativas < dicasLista.length) {
      const dicasDiv = document.getElementById("dicas");
      const novaDica = document.createElement("div");
      novaDica.textContent = dicasLista[tentativas];
      dicasDiv.appendChild(novaDica);
      tentativas++;
    }
  }
}

</script>

</body>
</html>
