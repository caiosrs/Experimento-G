<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Experimento G</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Inter', 'Segoe UI', sans-serif;
}

body {
  background: #000000;
  color: #f5f5f5;
  overflow: hidden;
}

/* ===== PARTÍCULAS DESFOCADAS ===== */
.particles {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: -1;
  overflow: hidden;
}

.particle {
  position: absolute;
  background: white;
  border-radius: 50%;
  filter: blur(2px);
  opacity: 0.15;
  animation: float linear infinite;
}

@keyframes float {
  from {
    transform: translateY(100vh);
  }
  to {
    transform: translateY(-10vh);
  }
}

/* ===== CONTAINER ===== */
.container {
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 20px;
}

.content {
  max-width: 600px;
  width: 100%;
  opacity: 0;
  animation: fadeIn 2s ease forwards;
}

h1 {
  font-weight: 300;
  letter-spacing: 4px;
  font-size: clamp(20px, 4vw, 28px);
  margin-bottom: 40px;
}

p {
  font-weight: 300;
  font-size: clamp(14px, 3.5vw, 18px);
  color: #cccccc;
  margin-bottom: 12px;
  opacity: 0;
  animation: fadeIn 2s ease forwards;
}

.line1 { animation-delay: 1s; }
.line2 { animation-delay: 2s; }
.line3 { animation-delay: 3s; }

.start-btn {
  margin-top: 40px;
  padding: 14px 40px;
  background: transparent;
  border: 1px solid #ffffff;
  color: #ffffff;
  font-size: 13px;
  letter-spacing: 2px;
  cursor: pointer;
  transition: 0.3s;
  opacity: 0;
  animation: fadeIn 2s ease forwards;
  animation-delay: 4s;
}

.start-btn:hover {
  background: #ffffff;
  color: #000000;
}

@keyframes fadeIn {
  to { opacity: 1; }
}

.fade-out {
  animation: fadeOut 1s forwards;
}

@keyframes fadeOut {
  to { opacity: 0; }
}

/* ===== MOBILE EXTRA ===== */
@media (max-width: 480px) {
  h1 {
    letter-spacing: 2px;
  }
  .start-btn {
    width: 100%;
  }
}
</style>
</head>
<body>

<!-- PARTÍCULAS -->
<div class="particles" id="particles"></div>

<!-- CONTEÚDO -->
<div class="container">
  <div class="content" id="intro">
    <h1>EXPERIMENTO G</h1>

    <p class="line1">Pequenos enigmas.</p>
    <p class="line2">Respostas simples.</p>
    <p class="line3">Um resultado maior.</p>

    <button class="start-btn" onclick="startGame()">INICIAR</button>
  </div>
</div>

<script>
/* ===== GERAR PARTÍCULAS SUAVES ===== */
const particlesContainer = document.getElementById("particles");

for (let i = 0; i < 35; i++) {
  const particle = document.createElement("div");
  particle.classList.add("particle");

  const size = Math.random() * 4 + 2; // tamanho entre 2px e 6px
  particle.style.width = size + "px";
  particle.style.height = size + "px";
  particle.style.left = Math.random() * 100 + "vw";
  particle.style.animationDuration = (15 + Math.random() * 15) + "s";
  particle.style.opacity = Math.random() * 0.2 + 0.05;

  particlesContainer.appendChild(particle);
}

/* ===== TRANSIÇÃO ===== */
function startGame() {
  const intro = document.getElementById("intro");
  intro.classList.add("fade-out");

  setTimeout(() => {
    window.location.href = "fase01.html";
  }, 1000);
}
</script>

</body>
</html>
