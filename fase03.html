<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Experimento G — Fase 03</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Inter', 'Segoe UI', sans-serif;
}

body {
  background: #000;
  color: #f5f5f5;
}

/* ===== PARTÍCULAS ===== */
.particles {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: -1;
  overflow: hidden;
}

.particle {
  position: absolute;
  background: white;
  border-radius: 50%;
  filter: blur(2px);
  opacity: 0.15;
  animation: float linear infinite;
}

@keyframes float {
  from { transform: translateY(100vh); }
  to { transform: translateY(-10vh); }
}

/* ===== CONTAINER ===== */
.container {
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 40px 20px;
}

.content {
  max-width: 600px;
  width: 100%;
  text-align: center;
}

h1 {
  font-weight: 300;
  letter-spacing: 3px;
  font-size: clamp(18px, 4vw, 24px);
  margin-bottom: 30px;
  opacity: 0.8;
}

.frase {
  font-size: clamp(14px, 3.8vw, 17px);
  line-height: 1.7;
  margin-bottom: 30px;
  color: #cccccc;
}

.luz {
  width: 60px;
  height: 60px;
  border-radius: 50%;
  margin: 20px auto;
  background: #111;
  transition: 0.1s ease;
}

.ligado1 {
  background: #00ffff;
}

.ligado0 {
  background: #ff00aa;
}

input {
  width: 100%;
  max-width: 320px;
  padding: 12px;
  background: transparent;
  border: 1px solid #fff;
  color: #fff;
  text-align: center;
  font-size: 15px;
  letter-spacing: 2px;
  outline: none;
}

button {
  margin-top: 18px;
  padding: 10px 30px;
  background: transparent;
  border: 1px solid #fff;
  color: #fff;
  cursor: pointer;
  transition: 0.3s;
}

button:hover {
  background: #fff;
  color: #000;
}

.dicas {
  margin-top: 25px;
  font-size: 14px;
  color: #aaa;
  min-height: 60px;
}

.sucesso {
  margin-top: 25px;
  font-size: 16px;
  letter-spacing: 2px;
  opacity: 0;
  transition: 1s;
}

.mostrar {
  opacity: 1;
}
</style>
</head>

<body>

<div class="particles" id="particles"></div>

<div class="container">
  <div class="content">

    <h1>FASE 03</h1>

    <div class="frase">
      Dois sons.<br>
      Dois sinais.<br>
      Um código.
    </div>

    <div class="luz" id="luz"></div>

    <button onclick="tocarCodigo()">OUVIR</button>

    <br><br>

    <input type="text" id="resposta" placeholder="Digite sua resposta">

    <br>
    <button onclick="verificar()">CONFIRMAR</button>

    <div class="dicas" id="dicas"></div>

    <div class="sucesso" id="sucesso">
      Fragmento coletado: É
    </div>

  </div>
</div>

<script>

/* Partículas */
const particlesContainer = document.getElementById("particles");
for (let i = 0; i < 30; i++) {
  const particle = document.createElement("div");
  particle.classList.add("particle");
  const size = Math.random() * 4 + 2;
  particle.style.width = size + "px";
  particle.style.height = size + "px";
  particle.style.left = Math.random() * 100 + "vw";
  particle.style.animationDuration = (15 + Math.random() * 15) + "s";
  particle.style.opacity = Math.random() * 0.2 + 0.05;
  particlesContainer.appendChild(particle);
}
</script>

<script>

/* Bloqueio */
if (!localStorage.getItem("fragmento2")) {
  window.location.href = "index.html";
}

/* ===== BINÁRIO ===== */
const codigo = "11101001";
const luz = document.getElementById("luz");
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

function tocarBit(bit, tempo) {
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();

  osc.connect(gain);
  gain.connect(audioCtx.destination);

  osc.frequency.value = bit === "1" ? 900 : 300;
  osc.type = "sine";
  gain.gain.value = 0.3;

  osc.start();
  osc.stop(audioCtx.currentTime + tempo);
}

async function tocarCodigo() {

  for (let bit of codigo) {

    // Luz visual
    luz.classList.remove("ligado1", "ligado0");
    luz.classList.add(bit === "1" ? "ligado1" : "ligado0");

    tocarBit(bit, 0.2);

    await new Promise(r => setTimeout(r, 350));
  }

  luz.classList.remove("ligado1", "ligado0");
}

/* ===== DICAS DIDÁTICAS ===== */
let tentativas = 0;

const dicasLista = [
  "Dica 1: O som agudo (azul) é 1. O grave (rosa) é 0.",
  "Dica 2: Anote a sequência de 1 e 0 que você ouvir.",
  "Dica 3: Pesquise: converter número binário para letra ASCII."
];

function normalizar(texto) {
  return texto.trim().toLowerCase();
}

function verificar() {
  const resposta = normalizar(document.getElementById("resposta").value);

  if (resposta === "é") {

    localStorage.setItem("fragmento3", "É");
    document.getElementById("sucesso").classList.add("mostrar");

    setTimeout(() => {
      window.location.href = "fase04.html";
    }, 2000);

  } else {

    if (tentativas < dicasLista.length) {
      const dica = document.createElement("div");
      dica.textContent = dicasLista[tentativas];
      document.getElementById("dicas").appendChild(dica);
      tentativas++;
    }
  }
}

</script>

</body>
</html>
